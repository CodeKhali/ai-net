name: Mutation Testing (weekly)

# Runs weekly on Sunday at 02:00 UTC.
# Can be triggered manually with an optional `target` input.
# Results are uploaded as artifacts and summarised in the job summary.
# Does NOT block PRs — mutation testing is a quality signal, not a gate.

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which target to mutate (backend|frontend|contracts|all)'
        required: false
        default: 'all'

permissions:
  contents: read

jobs:
  mutation-backend:
    name: Backend mutation (Stryker/Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'backend'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Stryker
        run: |
          npm install --no-save \
            @stryker-mutator/core@8.7.1 \
            @stryker-mutator/jest-runner@8.7.1

      - name: Run Stryker (backend)
        run: npx stryker run

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-backend-${{ github.run_id }}
          path: backend/reports/mutation/backend/
          retention-days: 30

      - name: Summarise surviving mutants
        if: always()
        run: |
          echo '### Backend Mutation Report' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          REPORT="reports/mutation/backend/report.json"
          if [ -f "$REPORT" ]; then
            node -e "
              const r = require('./$REPORT');
              const files = r.files || {};
              let survived = 0, killed = 0, total = 0;
              for (const f of Object.values(files)) {
                for (const m of (f.mutants || [])) {
                  total++;
                  if (m.status === 'Survived') survived++;
                  if (m.status === 'Killed') killed++;
                }
              }
              const score = typeof r.metrics?.mutationScore === 'number'
                ? r.metrics.mutationScore
                : total > 0 ? (killed / total) * 100 : null;
              const formattedScore = score === null ? 'N/A' : score.toFixed(1);
              console.log('| Metric | Value |');
              console.log('|--------|-------|');
              console.log('| Mutation score | ' + formattedScore + '% |');
              console.log('| Killed | ' + killed + ' |');
              console.log('| Survived | ' + survived + ' |');
              console.log('| Total | ' + total + ' |');
              if (survived > 0) {
                console.log('');
                console.log('#### Surviving mutants (sample)');
                console.log('');
                let shown = 0;
                for (const [file, fdata] of Object.entries(files)) {
                  for (const m of (fdata.mutants || [])) {
                    if (m.status === 'Survived' && shown < 10) {
                      console.log('- **' + file + '** L' + m.location.start.line + ': ' + m.mutatorName + ' — \`' + (m.replacement || '').slice(0, 80) + '\`');
                      shown++;
                    }
                  }
                }
              }
              if (score !== null && score < 70) process.exitCode = 1;
            " >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No report generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

  mutation-frontend:
    name: Frontend mutation (Stryker/Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'frontend'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Stryker
        run: |
          npm install --no-save \
            @stryker-mutator/core@8.7.1 \
            @stryker-mutator/vitest-runner@8.7.1

      - name: Run Stryker (frontend)
        run: npx stryker run

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-frontend-${{ github.run_id }}
          path: frontend/reports/mutation/frontend/
          retention-days: 30

      - name: Summarise surviving mutants
        if: always()
        run: |
          echo '### Frontend Mutation Report' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          REPORT="reports/mutation/frontend/report.json"
          if [ -f "$REPORT" ]; then
            node -e "
              const r = require('./$REPORT');
              const files = r.files || {};
              let survived = 0, killed = 0, total = 0;
              for (const f of Object.values(files)) {
                for (const m of (f.mutants || [])) {
                  total++;
                  if (m.status === 'Survived') survived++;
                  if (m.status === 'Killed') killed++;
                }
              }
              const score = typeof r.metrics?.mutationScore === 'number'
                ? r.metrics.mutationScore
                : total > 0 ? (killed / total) * 100 : null;
              const formattedScore = score === null ? 'N/A' : score.toFixed(1);
              console.log('| Metric | Value |');
              console.log('|--------|-------|');
              console.log('| Mutation score | ' + formattedScore + '% |');
              console.log('| Killed | ' + killed + ' |');
              console.log('| Survived | ' + survived + ' |');
              console.log('| Total | ' + total + ' |');
              if (survived > 0) {
                console.log('');
                console.log('#### Surviving mutants (sample)');
                console.log('');
                let shown = 0;
                for (const [file, fdata] of Object.entries(files)) {
                  for (const m of (fdata.mutants || [])) {
                    if (m.status === 'Survived' && shown < 10) {
                      console.log('- **' + file + '** L' + m.location.start.line + ': ' + m.mutatorName + ' — \`' + (m.replacement || '').slice(0, 80) + '\`');
                      shown++;
                    }
                  }
                }
              }
              if (score !== null && score < 70) process.exitCode = 1;
            " >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No report generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

  mutation-contracts:
    name: Contracts mutation (cargo-mutants)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'contracts'
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTFLAGS: '-C codegen-units=1'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: smart-contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: smart-contracts

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked --version 24.11.2

      - name: Run cargo-mutants across contracts
        run: |
          set -o pipefail
          cargo mutants \
            --workspace \
            --timeout 120 \
            --jobs 2 \
            --output mutants-output \
            -- --locked 2>&1 | tee mutants-output/run.log

      - name: Upload cargo-mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-contracts-${{ github.run_id }}
          path: smart-contracts/mutants-output/
          retention-days: 30

      - name: Summarise surviving mutants
        if: always()
        run: |
          echo '### Contracts Mutation Report (cargo-mutants)' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ -f mutants-output/mutants.json ]; then
            node -e "
              const outcomes = require('./mutants-output/mutants.json');
              const caught = outcomes.filter(o => o.summary === 'caught').length;
              const missed = outcomes.filter(o => o.summary === 'missed').length;
              const unviable = outcomes.filter(o => o.summary === 'unviable').length;
              const total = caught + missed;
              const score = total > 0 ? (caught / total) * 100 : null;
              const formattedScore = score === null ? 'N/A' : score.toFixed(1);
              console.log('| Metric | Value |');
              console.log('|--------|-------|');
              console.log('| Mutation score | ' + formattedScore + '% |');
              console.log('| Caught | ' + caught + ' |');
              console.log('| Missed | ' + missed + ' |');
              console.log('| Unviable | ' + unviable + ' |');
              console.log('| Scored mutants | ' + total + ' |');
              if (missed > 0) {
                console.log('');
                console.log('#### Missed mutants (surviving — human review needed)');
                console.log('');
                outcomes.filter(o => o.summary === 'missed').slice(0, 10).forEach(m => {
                  console.log('- **' + (m.package || '') + '** ' + (m.function || '') + ' in ' + (m.file || '') + ':' + (m.line || '') + ' — ' + (m.genre || '') + ': \`' + String(m.diff || '').slice(0, 120).replace(/\n/g, ' ') + '\`');
                });
              }
              if (score !== null && score < 70) process.exitCode = 1;
            " >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          elif [ -f mutants-output/run.log ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -50 mutants-output/run.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No report generated.' >> "$GITHUB_STEP_SUMMARY"
          fi
